<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
 <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
 </defs>

 <rect width="1200" height="630" fill="url(#bg)"/>
 <circle cx="980" cy="120" r="300" fill="url(#glow)"/>
 <circle cx="180" cy="560" r="240" fill="url(#glow)"/>

  <!-- كارت زجاجي -->
 <rect x="70" y="70" width="1060" height="490" rx="36"
        fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- اللوجو (مربع بحرف ر) -->
 <rect x="880" y="150" width="130" height="130" rx="30" fill="#2563eb"/>
 <text x="945" y="248" font-family="Cairo, Segoe UI, sans-serif" font-size="82"
        font-weight="800" fill="#ffffff" text-anchor="middle">ر</text>

  <!-- العنوان -->
 <text x="150" y="230" font-family="Cairo, Segoe UI, sans-serif" font-size="72"
        font-weight="800" fill="#ffffff">الرحمة المهداة للتوظيف</text>

  <!-- السطر الثاني -->
 <text x="150" y="320" font-family="Cairo, Segoe UI, sans-serif" font-size="44"
        font-weight="600" fill="#93c5fd">فرص عمل بالشركات العالمية</text>

  <!-- شارة -->
 <rect x="150" y="390" width="330" height="62" rx="31" fill="#25D366" fill-opacity="0.18"
        stroke="#25D366" stroke-opacity="0.5" stroke-width="2"/>
 <text x="315" y="432" font-family="Cairo, Segoe UI, sans-serif" font-size="26"
        font-weight="700" fill="#86efac" text-anchor="middle">مجاني تماماً للباحثين عن عمل</text>
</svg>